name: Build iOS Release (.ipa)

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Get Dependencies
        run: flutter pub get

      - name: Prepare App Store Connect Auth Key
        env:
          APP_STORE_CONNECT_PRIVATE_KEY: ${{ secrets.APP_STORE_CONNECT_PRIVATE_KEY }}
          APP_STORE_CONNECT_KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
        if: ${{ env.APP_STORE_CONNECT_PRIVATE_KEY != '' }}
        run: |
          mkdir -p ~/.appstoreconnect/private_keys
          echo "$APP_STORE_CONNECT_PRIVATE_KEY" > ~/.appstoreconnect/private_keys/AuthKey_${APP_STORE_CONNECT_KEY_ID}.p8

      - name: Fetch and Install Apple Certificates & Profiles via Fastlane
        env:
          APP_STORE_CONNECT_PRIVATE_KEY: ${{ secrets.APP_STORE_CONNECT_PRIVATE_KEY }}
          APP_STORE_CONNECT_KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
          APP_STORE_CONNECT_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
          BUILD_PROVISION_PROFILE_BASE64: ${{ secrets.BUILD_PROVISION_PROFILE_BASE64 }}
        if: ${{ env.APP_STORE_CONNECT_PRIVATE_KEY != '' }}
        run: |
          # 1. Setup temporary keychain
          security create-keychain -p "segurcelpass" build.keychain
          security default-keychain -s build.keychain
          security unlock-keychain -p "segurcelpass" build.keychain
          security set-keychain-settings -lut 3600 build.keychain

          # 2. Install decoded provisioning profile if provided
          mkdir -p ~/Library/MobileDevice/Provisioning\ Profiles
          if [ -n "$BUILD_PROVISION_PROFILE_BASE64" ]; then
            echo "$BUILD_PROVISION_PROFILE_BASE64" | base64 --decode > ~/Library/MobileDevice/Provisioning\ Profiles/SegurCel.mobileprovision
          fi

          # 3. Fetch provisioning profile via Fastlane
          fastlane run get_provisioning_profile \
            api_key_path:"$HOME/.appstoreconnect/private_keys/AuthKey_${APP_STORE_CONNECT_KEY_ID}.p8" \
            key_id:"$APP_STORE_CONNECT_KEY_ID" \
            issuer_id:"$APP_STORE_CONNECT_ISSUER_ID" \
            app_identifier:"com.segurcel.segurcel" || echo "Fastlane profile sync attempted!"

      - name: Build iOS Archive & Package Signed IPA
        env:
          APP_STORE_CONNECT_KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
          APP_STORE_CONNECT_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
        run: |
          if [ -n "$APP_STORE_CONNECT_KEY_ID" ]; then
            flutter build ipa --export-options-plist=ios/ExportOptions.plist --allow-provisioning-updates --authentication-key-id "$APP_STORE_CONNECT_KEY_ID" --authentication-key-issuer-id "$APP_STORE_CONNECT_ISSUER_ID" --authentication-key-path ~/.appstoreconnect/private_keys/AuthKey_${APP_STORE_CONNECT_KEY_ID}.p8 || flutter build ipa --no-codesign
          else
            flutter build ipa --no-codesign
          fi

          if [ ! -f build/ios/ipa/*.ipa ]; then
            mkdir -p build/ios/ipa/Payload
            cp -r build/ios/archive/Runner.xcarchive/Products/Applications/Runner.app build/ios/ipa/Payload/
            if [ -f ~/Library/MobileDevice/Provisioning\ Profiles/SegurCel.mobileprovision ]; then
              cp ~/Library/MobileDevice/Provisioning\ Profiles/SegurCel.mobileprovision build/ios/ipa/Payload/Runner.app/embedded.mobileprovision
            fi
            cd build/ios/ipa && zip -r SegurCel.ipa Payload && cd ../../..
          fi

      - name: Upload IPA Artifact to GitHub
        uses: actions/upload-artifact@v4
        with:
          name: ios-build-artifact
          path: build/ios/ipa/

      - name: Upload Build to TestFlight
        env:
          APP_STORE_CONNECT_PRIVATE_KEY: ${{ secrets.APP_STORE_CONNECT_PRIVATE_KEY }}
          APP_STORE_CONNECT_KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
          APP_STORE_CONNECT_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
        if: ${{ env.APP_STORE_CONNECT_PRIVATE_KEY != '' }}
        run: |
          xcrun altool --upload-app \
            -f build/ios/ipa/*.ipa \
            -t ios \
            --apiKey "$APP_STORE_CONNECT_KEY_ID" \
            --apiIssuer "$APP_STORE_CONNECT_ISSUER_ID"
