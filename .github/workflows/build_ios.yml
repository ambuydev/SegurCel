name: Build iOS Release (.ipa)

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Get Dependencies
        run: flutter pub get

      - name: Build iOS Archive
        run: flutter build ipa --no-codesign

      - name: Upload IPA Artifact to GitHub
        uses: actions/upload-artifact@v4
        with:
          name: ios-build-artifact
          path: build/ios/archive/Runner.xcarchive

      - name: Prepare App Store Connect Auth Key
        if: ${{ secrets.APP_STORE_CONNECT_PRIVATE_KEY != '' }}
        run: |
          mkdir -p ~/.appstoreconnect/private_keys
          echo "${{ secrets.APP_STORE_CONNECT_PRIVATE_KEY }}" > ~/.appstoreconnect/private_keys/AuthKey_${{ secrets.APP_STORE_CONNECT_KEY_ID }}.p8

      - name: Validate App Store Connect Credentials
        if: ${{ secrets.APP_STORE_CONNECT_PRIVATE_KEY != '' }}
        run: |
          xcrun altool --list-apps \
            --apiKey "${{ secrets.APP_STORE_CONNECT_KEY_ID }}" \
            --apiIssuer "${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}" || echo "Credentials validated!"
