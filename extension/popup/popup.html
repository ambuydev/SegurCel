<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SegurCel Bóveda</title>
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <div class="app-container">
    <!-- Encabezado -->
    <header class="app-header">
      <div class="logo-container">
        <img src="../icons/icon48.png" alt="SegurCel" class="app-icon">
        <span class="app-title">SegurCel</span>
      </div>
      <div id="header-actions" class="hidden">
        <button id="btn-lock" class="icon-btn" title="Bloquear Bóveda">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <rect x="3" y="11" width="18" height="11" rx="2" ry="2"></rect>
            <path d="M7 11V7a5 5 0 0 1 10 0v4"></path>
          </svg>
        </button>
        <button id="btn-logout" class="icon-btn danger" title="Cerrar Sesión">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"></path>
            <polyline points="16 17 21 12 16 7"></polyline>
            <line x1="21" y1="12" x2="9" y2="12"></line>
          </svg>
        </button>
      </div>
    </header>

    <!-- VISTA 1: INICIO DE SESIÓN FIREBASE -->
    <section id="view-login" class="view">
      <div class="card">
        <h2>Inicia Sesión</h2>
        <p class="subtitle">Conéctate con tu cuenta de SegurCel</p>

        <div class="input-group">
          <label for="login-email">Correo Electrónico</label>
          <input type="email" id="login-email" placeholder="tu@correo.com">
        </div>

        <div class="input-group">
          <label for="login-password">Contraseña</label>
          <input type="password" id="login-password" placeholder="••••••••">
        </div>

        <div id="login-error" class="error-msg hidden"></div>

        <button id="btn-login" class="btn-primary">
          <span class="btn-text">Iniciar Sesión</span>
          <div class="spinner hidden"></div>
        </button>
      </div>
    </section>

    <!-- VISTA 2: DESBLOQUEO POR PIN -->
    <section id="view-pin" class="view hidden">
      <div class="card text-center">
        <div class="shield-badge">🛡️</div>
        <h2 id="user-email-display">usuario@correo.com</h2>
        <p class="subtitle">Ingresa tu PIN Maestro de 4 dígitos</p>

        <div class="pin-container">
          <input type="password" id="pin-input" maxlength="4" placeholder="••••" autocomplete="off" autofocus>
        </div>

        <div id="pin-error" class="error-msg hidden"></div>

        <button id="btn-unlock" class="btn-primary">Desbloquear Bóveda</button>
      </div>
    </section>

    <!-- VISTA 3: BÓVEDA Y CONTRASEÑAS -->
    <section id="view-vault" class="view hidden">
      <!-- Barra Superior con Búsqueda y Pestañas -->
      <div class="vault-controls">
        <div class="search-box">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#A0AEC0" stroke-width="2">
            <circle cx="11" cy="11" r="8"></circle>
            <line x1="21" y1="21" x2="16.65" y2="16.65"></line>
          </svg>
          <input type="text" id="search-input" placeholder="Buscar sitio o cuenta...">
        </div>

        <div class="tabs">
          <button id="tab-matches" class="tab-btn active">Este Sitio</button>
          <button id="tab-all" class="tab-btn">Todas</button>
          <button id="tab-generator" class="tab-btn">Generador</button>
        </div>
      </div>

      <!-- Lista de Contraseñas -->
      <div id="entries-container" class="entries-list"></div>

      <!-- Panel Generador de Contraseñas (Oculto por defecto) -->
      <div id="generator-panel" class="generator-card hidden">
        <h3>Generador de Claves Seguras</h3>

        <div class="generated-output">
          <span id="gen-password-display">k9#mP!8xQ2$L</span>
          <button id="btn-copy-gen" class="btn-sm" title="Copiar">📋 Copiar</button>
        </div>

        <div class="gen-slider-group">
          <label>Longitud: <span id="gen-length-val">16</span></label>
          <input type="range" id="gen-length" min="8" max="32" value="16">
        </div>

        <button id="btn-generate-new" class="btn-secondary">🔄 Generar Nueva</button>
      </div>
    </section>
  </div>

  <script type="module" src="popup.js"></script>
</body>
</html>
